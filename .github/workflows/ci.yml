name: Validate LedgerDesk
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ledgerdesk
          POSTGRES_PASSWORD: ledgerdesk
          POSTGRES_DB: ledgerdesk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledgerdesk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://ledgerdesk:ledgerdesk@127.0.0.1:5432/ledgerdesk
      LOG_SILENT: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm run benchmark
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            docs/dashboard.png
            docs/mobile.png
            test-results/
